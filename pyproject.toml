[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deploywitness"
version = "0.1.0a1"
description = "Local-first infrastructure change analysis with deterministic failure witnesses"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "DeployWitness contributors"}]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]

[project.scripts]
deploywitness = "deploywitness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<3", "types-PyYAML", "build>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/deploywitness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
